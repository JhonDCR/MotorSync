name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detects which packages changed. Jobs are skipped instead of not triggered (on.paths),
  # because a required check that never runs leaves the PR stuck as "pending";
  # a skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.scaffold.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' && steps.scaffold.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v5
      # Until the Angular/NestJS scaffolds exist there is nothing to build: skip those jobs.
      - id: scaffold
        run: |
          echo "backend=$([ -f backend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # The agent harness is code too: its guards have tests and must stay green.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hook tests
        run: node --test ".claude/hooks/*.test.mjs"
      - name: Validate settings.json
        run: node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # test:perf seeds ~800 000 rows; locally it took from 1 to 9 minutes depending on machine load.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motorsync
          POSTGRES_PASSWORD: motorsync_ci
          POSTGRES_DB: motorsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motorsync -d motorsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Ephemeral CI database: these passwords protect nothing outside the runner (research R2).
    env:
      DATABASE_ADMIN_URL: postgresql://motorsync:motorsync_ci@localhost:5432/motorsync_test
      DATABASE_MIGRATOR_URL: postgresql://motorsync_migrator:migrator_ci@localhost:5432/motorsync_test
      DATABASE_URL: postgresql://motorsync_app:app_ci@localhost:5432/motorsync_test
      DB_MIGRATOR_PASSWORD: migrator_ci
      DB_APP_PASSWORD: app_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate JWT secret for this run
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:bootstrap
      - run: npm run db:migrate
      - run: npm run test:e2e
      # US1-AC10 / SC-001: seeds 10 workshops x 50 000 vehicles and fails if the search p95 reaches 200 ms.
      - run: npm run test:perf

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Angular 22 runs Vitest with jsdom: no browser needed, --watch=false makes it a single run.
      - run: npm test -- --watch=false
      - run: npm run build
