<header class="support-header" data-testid="support-header">
  <div class="support-header-brand-nav">
    <a routerLink="/support" class="support-brand">Soporte MotorSync</a>
    <nav class="support-nav" aria-label="Navegación de soporte">
      <a
        routerLink="/support"
        class="support-nav-link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Bandeja
      </a>
      <a
        routerLink="/support/workshops"
        class="support-nav-link"
        routerLinkActive="active"
      >
        Talleres
      </a>
      <a
        routerLink="/support/access-log"
        class="support-nav-link"
        routerLinkActive="active"
      >
        Bitácora
      </a>
    </nav>
  </div>

  @if (session.agent(); as agent) {
    <div class="support-session-bar">
      <span class="support-agent-name" data-testid="support-agent-name">{{ agent.name }}</span>
      <button
        type="button"
        class="support-logout"
        data-testid="support-logout"
        [disabled]="loggingOut()"
        [attr.aria-busy]="loggingOut() ? 'true' : null"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  }
</header>

<div class="support-content">
  <router-outlet />
</div>
